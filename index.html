<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase URL Shortener</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    input[type="text"] {
      width: 80%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 5px;
    }
    button:hover { background-color: #0056b3; }
    #result { margin-top: 15px; font-weight: bold; }
    ul { text-align: left; margin-top: 15px; padding-left: 20px; }
    ul li { margin-bottom: 5px; }
    ul li button {
      background-color: #dc3545;
      margin-left: 10px;
    }
    ul li button:hover { background-color: #a71d2a; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Firebase URL Shortener</h1>
    <input type="text" id="longUrl" placeholder="Enter your URL here">
    <button id="shortenBtn">Shorten URL</button>
    <div id="result"></div>
    <h2>Saved URLs:</h2>
    <ul id="urlList"></ul>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // 1️⃣ Initialize Firebase
   const firebaseConfig = {
  apiKey: "AIzaSyBIs4SwCfUqzPge0LxqNUwqUzKzFknfv3I",
  authDomain: "videoappxyz.firebaseapp.com",
  projectId: "videoappxyz",
  storageBucket: "videoappxyz.firebasestorage.app",
  messagingSenderId: "200506250623",
  appId: "1:200506250623:web:0d48b8c61c6f9c519af64a",
  measurementId: "G-C1MRPHZ796"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const shortenBtn = document.getElementById("shortenBtn");
    const longUrlInput = document.getElementById("longUrl");
    const resultDiv = document.getElementById("result");
    const urlList = document.getElementById("urlList");

    const baseUrl = "https://rewardtube.netlify.app/"; // Replace with your domain

    // 2️⃣ Shorten URL and save in Firebase
    shortenBtn.addEventListener("click", () => {
      const longUrl = longUrlInput.value.trim();
      if (!longUrl) { alert("Please enter a URL!"); return; }

      const shortCode = generateShortCode();
      const shortUrl = baseUrl + shortCode;

      db.ref("urls/" + shortCode).set({ longUrl, shortUrl })
        .then(() => {
          resultDiv.innerHTML = `Short URL: <a href="${longUrl}" target="_blank">${shortUrl}</a>`;
          longUrlInput.value = "";
        })
        .catch(err => console.error(err));
    });

    // 3️⃣ Listen to Firebase for URL list updates
    db.ref("urls").on("value", snapshot => {
      const urls = snapshot.val();
      renderUrlList(urls);
    });

    function generateShortCode(length = 6) {
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let code = "";
      for (let i = 0; i < length; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
      return code;
    }

    function renderUrlList(urls) {
      urlList.innerHTML = "";
      if (!urls) return;

      Object.keys(urls).forEach(key => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="${urls[key].longUrl}" target="_blank">${urls[key].shortUrl}</a>
                        <button onclick="deleteUrl('${key}')">Delete</button>`;
        urlList.appendChild(li);
      });
    }

    function deleteUrl(key) {
      db.ref("urls/" + key).remove()
        .catch(err => console.error(err));
    }

    // Make deleteUrl global so it can be called from inline onclick
    window.deleteUrl = deleteUrl;
  </script>
</body>
</html>
