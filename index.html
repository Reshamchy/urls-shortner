<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitly URL Shortener</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    input[type="text"] {
      width: 80%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 5px;
    }
    button:hover { background-color: #0056b3; }
    #result { margin-top: 15px; font-weight: bold; }
    ul { text-align: left; margin-top: 15px; padding-left: 20px; }
    ul li { margin-bottom: 5px; }
    ul li button { background-color: #dc3545; margin-left: 10px; }
    ul li button:hover { background-color: #a71d2a; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bitly URL Shortener</h1>
    <input type="text" id="longUrl" placeholder="Enter your URL here (include http:// or https://)">
    <button id="shortenBtn">Shorten URL</button>
    <div id="result"></div>
    <h2>Saved URLs:</h2>
    <ul id="urlList"></ul>
  </div>

  <script>
    const shortenBtn = document.getElementById("shortenBtn");
    const longUrlInput = document.getElementById("longUrl");
    const resultDiv = document.getElementById("result");
    const urlList = document.getElementById("urlList");

    const BITLY_TOKEN = "c08d780cf2385057a15ecb1741981015bba20149"; // 🔑 Put your token here

    let urls = JSON.parse(localStorage.getItem("urls")) || [];
    renderUrlList();

    shortenBtn.addEventListener("click", async () => {
      let longUrl = longUrlInput.value.trim();
      if (!longUrl) return alert("Please enter a URL!");
      if (!longUrl.startsWith("http")) {
        longUrl = "https://" + longUrl; // auto-fix missing protocol
      }

      try {
        const shortUrl = await shortenWithBitly(longUrl);
        urls.push({ longUrl, shortUrl });
        localStorage.setItem("urls", JSON.stringify(urls));
        resultDiv.innerHTML = `Short URL: <a href="${shortUrl}" target="_blank">${shortUrl}</a>`;
        renderUrlList();
        longUrlInput.value = "";
      } catch (err) {
        alert("Error shortening URL: " + err.message);
        console.error(err);
      }
    });

    async function shortenWithBitly(longUrl) {
      const response = await fetch("https://api-ssl.bitly.com/v4/shorten", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${BITLY_TOKEN}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ long_url: longUrl })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.message || "Bitly API error");
      }

      const data = await response.json();
      return data.link; // real Bitly short URL
    }

    function renderUrlList() {
      urlList.innerHTML = "";
      urls.forEach((urlObj, index) => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="${urlObj.shortUrl}" target="_blank">${urlObj.shortUrl}</a>
                        <button onclick="deleteUrl(${index})">Delete</button>`;
        urlList.appendChild(li);
      });
    }

    function deleteUrl(index) {
      urls.splice(index, 1);
      localStorage.setItem("urls", JSON.stringify(urls));
      renderUrlList();
    }
  </script>
</body>
</html>
